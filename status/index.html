<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek</title>
    <style>
      html,
      body {
        margin: 0;
        height: 24px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        font-family: var(--oc-font, system-ui, sans-serif);
      }
      /* No fill of its own: the panel background stays the only surface, so
         the brackets carry the shape in light and dark themes alike. */
      #badge {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      #label {
        font-weight: 600;
        color: var(--oc-muted, #888);
      }
      #badge[data-peak='true'] #label {
        color: var(--oc-warning-text, var(--oc-muted, #888));
      }
      #count {
        color: var(--oc-muted, #888);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <span id="badge" data-peak="false" hidden>
      <span id="label"></span>
      <span id="count"></span>
    </span>
    <script src="peak.js"></script>
    <script src="main.js"></script>
  </body>
</html>
